<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Size Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-1">
                            Lot Size Calculator
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Forex Risk Management Tool
                        </p>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Account Balance ($)
                                </label>

                                <input
                                    type="number"
                                    id="balance"
                                    class="form-control"
                                    placeholder="5000">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Risk (%)
                                </label>

                                <input
                                    type="number"
                                    id="risk"
                                    class="form-control"
                                    placeholder="1">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Instrument
                            </label>

                            <select
                                id="instrument"
                                class="form-select">
                            </select>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Entry Price
                                </label>

                                <input
                                    type="number"
                                    id="entry"
                                    step="0.00001"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Stop Loss
                                </label>

                                <input
                                    type="number"
                                    id="stopLoss"
                                    step="0.00001"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Take Profit
                            </label>

                            <input
                                type="number"
                                id="takeProfit"
                                step="0.00001"
                                class="form-control">

                        </div>

                        

                        <hr class="my-4">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <div class="result-card">

                                    <h6>Risk Amount</h6>

                                    <h3 id="riskAmount">
                                        $0.00
                                    </h3>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="result-card">

                                    <h6>Lot Size</h6>

                                    <h3 id="lotSize">
                                        0.00 Lots
                                    </h3>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="result-card">

                                    <h6>Stop Loss</h6>

                                    <h3 id="slPips">
                                        0 pips
                                    </h3>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="result-card">

                                    <h6>Risk : Reward</h6>

                                    <h3 id="rr">
                                        1 : 0
                                    </h3>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="instruments.js"></script>
    <script src="script.js"></script>

</body>

</html>
